<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
	<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
	  <stop offset="0%" stop-color="#171132"/>
	  <stop offset="55%" stop-color="#100c22"/>
	  <stop offset="100%" stop-color="#0a0c16"/>
	</linearGradient>
	<radialGradient id="glow" cx="72%" cy="26%" r="55%">
	  <stop offset="0%" stop-color="#8b7cf6" stop-opacity="0.35"/>
	  <stop offset="100%" stop-color="#8b7cf6" stop-opacity="0"/>
	</radialGradient>
	<linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
	  <stop offset="0%" stop-color="#fff3d6"/>
	  <stop offset="55%" stop-color="#f2c879"/>
	  <stop offset="100%" stop-color="#d79f45"/>
	</linearGradient>
	<linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
	  <stop offset="0%" stop-color="#8b7cf6"/>
	  <stop offset="100%" stop-color="#f2c879"/>
	</linearGradient>
  </defs>

  <!-- badge background -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="115" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- stars -->
  <circle cx="128" cy="118" r="5" fill="#eae7f6" opacity="0.85"/>
  <circle cx="392" cy="150" r="3.4" fill="#eae7f6" opacity="0.6"/>
  <circle cx="150" cy="392" r="3" fill="#eae7f6" opacity="0.5"/>

  <!-- crescent moon -->
  <g transform="translate(256,208)">
	<path d="M 62,-88 A 92,92 0 1 0 62,88 A 74,74 0 1 1 62,-88 Z" fill="url(#moon)"/>
  </g>

  <!-- sleep / mood wave -->
  <path d="M 76,372 C 130,338 158,338 190,368 C 222,398 250,398 282,362 C 314,326 342,326 374,356 C 400,381 420,384 436,372"
		fill="none" stroke="url(#wave)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
